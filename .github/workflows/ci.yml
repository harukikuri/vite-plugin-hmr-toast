# Every push to main, every pull request and every release: lint and types, then the tests
# against each Vite major the plugin supports (peerDependencies: vite >=5).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # from release.yml, before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vite: [5, 6, 7, 8]
    name: test (Vite ${{ matrix.vite }})
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Under an alias, so Vitest keeps the Vite it needs (Vitest 5 doesn't run on Vite 5).
      - run: pnpm add -D vite-under-test@npm:vite@${{ matrix.vite }}
      - run: pnpm test
        env:
          VITE_PACKAGE: vite-under-test
          VITE_MAJOR: ${{ matrix.vite }}
