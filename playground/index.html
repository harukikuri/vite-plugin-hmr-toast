<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>hmr-toast playground</title>
  </head>
  <body>
    <h1>hmr-toast playground</h1>
    <ul>
      <li>Edit <code>src/counter.js</code> → <b>HMR</b> (it accepts its own updates)</li>
      <li>Edit <code>src/style.css</code> → <b>CSS</b></li>
      <li>Edit <code>src/main.js</code> → <b>RELOAD</b> (nothing accepts it)</li>
      <li>Edit <code>src/data.generated.js</code> → full reload, no toast (excluded)</li>
    </ul>
    <button type="button" id="counter"></button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
